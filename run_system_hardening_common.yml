---
- name: Run System Hardening (Common Entry Point)
  hosts: all
  become: true
  gather_facts: false

  vars:
    # default values (AWX will override these through Survey)
    run_modes: "{{ run_modes | default(['ntp']) }}"
    os_type: "{{ survey_os_type | default('generic') }}"   # renamed to avoid recursion

  roles:
    - role: system_hardening_common
