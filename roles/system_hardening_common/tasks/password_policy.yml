# ============================================
# Password Policy Enforcement (Generic Linux)
# ============================================

- name: Check if pam_pwquality is configured
  ansible.builtin.shell: |
    grep -E 'pam_pwquality\.so' /etc/pam.d/system-auth || true
  register: pam_pwquality_check
  changed_when: false

- name: Set variables based on PAM presence
  ansible.builtin.set_fact:
    pam_enabled: "{{ pam_pwquality_check.stdout != '' }}"

- name: Debug which method will be used
  ansible.builtin.debug:
    msg: "PAM is {{ 'enabled' if pam_enabled else 'not enabled' }}. Proceeding accordingly."

# =======================================================
# PAM-enabled systems
# =======================================================

- name: Ensure minlen is set in pwquality.conf
  ansible.builtin.lineinfile:
    path: /etc/security/pwquality.conf
    regexp: '^minlen'
    line: "minlen = {{ password_minlen }}"
    create: yes
  when: pam_enabled

# Check which PAM files exist
- name: Check PAM files existence
  ansible.builtin.stat:
    path: "{{ item }}"
  loop:
    - /etc/pam.d/system-auth
    - /etc/pam.d/system-auth-ac
  register: pam_files
  when: pam_enabled

- name: Ensure password history (remember=5) in PAM configs
  ansible.builtin.replace:
    path: "{{ item.stat.path }}"
    regexp: '^(password\s+.*pam_unix\.so(?!.*remember=\d+).*)$'
    replace: '\1 remember=5'
    backup: yes
  loop: "{{ pam_files.results }}"
  when:
    - pam_enabled
    - item.stat.exists

# =======================================================
# Non-PAM fallback (legacy systems only)
# =======================================================

- name: Set PASS_MIN_LEN in /etc/login.defs
  ansible.builtin.lineinfile:
    path: /etc/login.defs
    regexp: '^PASS_MIN_LEN'
    line: "PASS_MIN_LEN {{ password_minlen }}"
    create: yes
  when: not pam_enabled

- name: Set PASS_MAX_LEN in /etc/login.defs
  ansible.builtin.lineinfile:
    path: /etc/login.defs
    regexp: '^PASS_MAX_LEN'
    line: "PASS_MAX_LEN {{ password_maxlen }}"
    create: yes
  when: not pam_enabled








