- name: Detect OS type
  ansible.builtin.raw: uname
  register: os_name
  changed_when: false

- name: Set platform-specific facts
  set_fact:
    ssh_service_restart_cmd: >-
      {% if 'AIX' in os_name.stdout %}
      startsrc -s sshd
      {% elif 'SunOS' in os_name.stdout %}
      svcadm restart svc:/network/ssh:default
      {% elif 'HP-UX' in os_name.stdout %}
      /sbin/init.d/sshd restart
      {% else %}
      systemctl restart sshd
      {% endif %}
    banner_owner: root
    banner_group: "{{ 'system' if 'AIX' in os_name.stdout else 'root' }}"

- name: Backup /etc/issue if it exists
  ansible.builtin.raw: |
    if [ -f {{ banner_file }} ]; then
      cp {{ banner_file }} {{ banner_file }}.bak_{{ timestamp }}
    else
      echo "No /etc/issue found"
    fi
  become: true

- name: Backup sshd_config if it exists
  ansible.builtin.raw: |
    if [ -f {{ sshd_config_path }} ]; then
      cp {{ sshd_config_path }} {{ sshd_config_path }}.bak_{{ timestamp }}
    else
      echo "No sshd_config found"
    fi
  become: true

- name: Write banner to /etc/issue
  ansible.builtin.raw: |
    cat << 'EOF' > {{ banner_file }}
    {{ banner_text }}
    EOF
  become: true

- name: Set permissions on /etc/issue
  ansible.builtin.raw: |
    chmod 644 {{ banner_file }}
    chown {{ banner_owner }} {{ banner_file }}
    chgrp {{ banner_group }} {{ banner_file }}
  become: true

- name: Ensure Banner directive is present in sshd_config
  ansible.builtin.raw: |
    if grep -q '^Banner' {{ sshd_config_path }}; then
      sed 's|^Banner.*|Banner /etc/issue|' {{ sshd_config_path }} > /tmp/sshd_config &&
      mv /tmp/sshd_config {{ sshd_config_path }}
    else
      echo 'Banner /etc/issue' >> {{ sshd_config_path }}
    fi
  become: true

- name: Ensure RSAAuthentication is enabled (legacy systems only)
  ansible.builtin.raw: |
    if grep -q '^RSAAuthentication' {{ sshd_config_path }}; then
      sed 's|^RSAAuthentication.*|RSAAuthentication yes|' {{ sshd_config_path }} > /tmp/sshd_config &&
      mv /tmp/sshd_config {{ sshd_config_path }}
    else
      echo 'RSAAuthentication yes' >> {{ sshd_config_path }}
    fi
  become: true

- name: Ensure KerberosAuthentication is enabled
  ansible.builtin.raw: |
    if grep -q '^KerberosAuthentication' {{ sshd_config_path }}; then
      sed 's|^KerberosAuthentication.*|KerberosAuthentication yes|' {{ sshd_config_path }} > /tmp/sshd_config &&
      mv /tmp/sshd_config {{ sshd_config_path }}
    else
      echo 'KerberosAuthentication yes' >> {{ sshd_config_path }}
    fi
  become: true

- name: Restart SSH service (safe for AWX and non-systemd OS)
  ansible.builtin.raw: "{{ ssh_service_restart_cmd }}"
  become: true
  ignore_errors: true
