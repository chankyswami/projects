# ============================================
# Kerberos, RSA, Banner Hardening for UNIX
# AIX / Solaris / HP-UX / Linux
# ============================================

- name: Detect OS type
  ansible.builtin.raw: uname
  register: os_name
  changed_when: false

- name: Set platform-specific facts
  ansible.builtin.set_fact:
    ssh_service_restart_cmd: >-
      {% if 'AIX' in os_name.stdout %}
      startsrc -s sshd
      {% elif 'SunOS' in os_name.stdout %}
      svcadm restart svc:/network/ssh:default
      {% elif 'HP-UX' in os_name.stdout %}
      /sbin/init.d/sshd restart
      {% else %}
      systemctl restart sshd
      {% endif %}
    banner_owner: root
    banner_group: "{{ 'system' if 'AIX' in os_name.stdout else 'root' }}"

# ------------------------------------------------
# Backup files (once per run, no change reported)
# ------------------------------------------------
- name: Backup banner file if it exists
  ansible.builtin.raw: |
    [ -f {{ banner_file }} ] && cp {{ banner_file }} {{ banner_file }}.bak_{{ timestamp }} || true
  changed_when: false
  become: true

- name: Backup sshd_config if it exists
  ansible.builtin.raw: |
    [ -f {{ sshd_config_path }} ] && cp {{ sshd_config_path }} {{ sshd_config_path }}.bak_{{ timestamp }} || true
  changed_when: false
  become: true

# ------------------------------------------------
# Banner enforcement (IDEMPOTENT)
# ------------------------------------------------
- name: Enforce login banner content safely
  ansible.builtin.raw: |
    TMP=$(mktemp /tmp/issue.XXXXXX)
    cat << 'EOF' > "$TMP"
    {{ banner_text }}
    EOF

    if [ ! -f {{ banner_file }} ] || ! cmp -s "$TMP" {{ banner_file }}; then
      mv "$TMP" {{ banner_file }}
      echo "changed"
    else
      rm -f "$TMP"
    fi
  register: banner_update
  changed_when: "'changed' in banner_update.stdout"
  become: true
  notify: Restart SSH service-unix

- name: Ensure banner permissions (no false change)
  ansible.builtin.raw: |
    stat -c "%a %U %G" {{ banner_file }} 2>/dev/null | grep -q "644 {{ banner_owner }} {{ banner_group }}" \
    || (chmod 644 {{ banner_file }} && chown {{ banner_owner }} {{ banner_file }} && chgrp {{ banner_group }} {{ banner_file }} && echo changed)
  register: banner_perm
  changed_when: "'changed' in banner_perm.stdout"
  become: true

# ------------------------------------------------
# SSH Banner directive (IDEMPOTENT)
# ------------------------------------------------
- name: Ensure Banner directive in sshd_config
  ansible.builtin.raw: |
    grep -q '^Banner {{ banner_file }}' {{ sshd_config_path }} && exit 0

    TMP=$(mktemp /tmp/sshd_config.XXXXXX)
    grep -v '^Banner' {{ sshd_config_path }} > "$TMP"
    echo 'Banner {{ banner_file }}' >> "$TMP"

    if ! cmp -s "$TMP" {{ sshd_config_path }}; then
      mv "$TMP" {{ sshd_config_path }}
      echo changed
    else
      rm -f "$TMP"
    fi
  register: ssh_banner
  changed_when: "'changed' in ssh_banner.stdout"
  become: true
  notify: Restart SSH service-unix

# ------------------------------------------------
# RSAAuthentication (legacy, only if exists)
# ------------------------------------------------
- name: Enforce RSAAuthentication if present
  ansible.builtin.raw: |
    grep -q '^RSAAuthentication' {{ sshd_config_path }} || exit 0

    grep -q '^RSAAuthentication yes' {{ sshd_config_path }} && exit 0

    TMP=$(mktemp /tmp/sshd_config.XXXXXX)
    sed 's/^RSAAuthentication.*/RSAAuthentication yes/' {{ sshd_config_path }} > "$TMP"

    if ! cmp -s "$TMP" {{ sshd_config_path }}; then
      mv "$TMP" {{ sshd_config_path }}
      echo changed
    else
      rm -f "$TMP"
    fi
  register: rsa_auth
  changed_when: "'changed' in rsa_auth.stdout"
  become: true
  notify: Restart SSH service-unix

# ------------------------------------------------
# Kerberos enforcement (ONLY if configured)
# ------------------------------------------------
- name: Check if KerberosAuthentication is present
  ansible.builtin.raw: |
    grep -q '^KerberosAuthentication' {{ sshd_config_path }} && echo present || echo absent
  register: kerberos_present
  changed_when: false
  become: true

- name: Enforce KerberosAuthentication if present
  ansible.builtin.raw: |
    grep -q '^KerberosAuthentication yes' {{ sshd_config_path }} && exit 0

    TMP=$(mktemp /tmp/sshd_config.XXXXXX)
    sed 's/^KerberosAuthentication.*/KerberosAuthentication yes/' {{ sshd_config_path }} > "$TMP"

    if ! cmp -s "$TMP" {{ sshd_config_path }}; then
      mv "$TMP" {{ sshd_config_path }}
      echo changed
    else
      rm -f "$TMP"
    fi
  when: kerberos_present.stdout == "present"
  register: kerberos_auth
  changed_when: "'changed' in kerberos_auth.stdout"
  become: true
  notify: Restart SSH service-unix
