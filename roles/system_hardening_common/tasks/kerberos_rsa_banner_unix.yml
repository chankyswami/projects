# ============================================
# Kerberos, RSA, Banner Hardening for UNIX
# AIX / Solaris / HP-UX / Linux
# ============================================

- name: Detect OS type
  ansible.builtin.raw: uname
  register: os_name
  changed_when: false

- name: Set platform-specific facts
  ansible.builtin.set_fact:
    ssh_service_restart_cmd: >-
      {% if 'AIX' in os_name.stdout %}
      startsrc -s sshd
      {% elif 'SunOS' in os_name.stdout %}
      svcadm restart svc:/network/ssh:default
      {% elif 'HP-UX' in os_name.stdout %}
      /sbin/init.d/sshd restart
      {% else %}
      systemctl restart sshd
      {% endif %}
    banner_owner: root
    banner_group: "{{ 'system' if 'AIX' in os_name.stdout else 'root' }}"

# ------------------------------------------------
# Backup files safely
# ------------------------------------------------
- name: Backup /etc/issue if it exists
  ansible.builtin.raw: |
    [ -f {{ banner_file }} ] && cp {{ banner_file }} {{ banner_file }}.bak_{{ timestamp }} || true
  changed_when: false
  become: true

- name: Backup sshd_config if it exists
  ansible.builtin.raw: |
    [ -f {{ sshd_config_path }} ] && cp {{ sshd_config_path }} {{ sshd_config_path }}.bak_{{ timestamp }} || true
  changed_when: false
  become: true

# ------------------------------------------------
# Banner enforcement
# ------------------------------------------------
- name: Ensure login banner content
  ansible.builtin.raw: |
    if [ ! -f {{ banner_file }} ] || ! grep -Fxq "{{ banner_text }}" {{ banner_file }}; then
      cat << 'EOF' > {{ banner_file }}
    {{ banner_text }}
    EOF
    fi
  become: true
  notify: Restart SSH service-unix

- name: Ensure banner permissions
  ansible.builtin.raw: |
    chmod 644 {{ banner_file }} &&
    chown {{ banner_owner }} {{ banner_file }} &&
    chgrp {{ banner_group }} {{ banner_file }}
  changed_when: false
  become: true

- name: Ensure Banner directive in sshd_config
  ansible.builtin.raw: |
    if ! grep -q '^Banner /etc/issue' {{ sshd_config_path }}; then
      TMP=$(mktemp /tmp/sshd_config.XXXXXX)
      grep -v '^Banner' {{ sshd_config_path }} > "$TMP"
      echo 'Banner /etc/issue' >> "$TMP"
      mv "$TMP" {{ sshd_config_path }}
    fi
  become: true
  notify: Restart SSH service-unix

# ------------------------------------------------
# RSAAuthentication (legacy only)
# ------------------------------------------------
- name: Ensure RSAAuthentication enabled if present
  ansible.builtin.raw: |
    if grep -q '^RSAAuthentication' {{ sshd_config_path }}; then
      TMP=$(mktemp /tmp/sshd_config.XXXXXX)
      sed 's/^RSAAuthentication.*/RSAAuthentication yes/' {{ sshd_config_path }} > "$TMP" &&
      mv "$TMP" {{ sshd_config_path }}
    fi
  become: true
  notify: Restart SSH service-unix

# ------------------------------------------------
# Kerberos enforcement ONLY if already configured
# ------------------------------------------------
- name: Check if KerberosAuthentication is present
  ansible.builtin.raw: |
    grep -q '^KerberosAuthentication' {{ sshd_config_path }} && echo present || echo absent
  register: kerberos_present
  changed_when: false
  become: true

- name: Enforce KerberosAuthentication if present
  ansible.builtin.raw: |
    TMP=$(mktemp /tmp/sshd_config.XXXXXX)
    sed 's/^KerberosAuthentication.*/KerberosAuthentication yes/' {{ sshd_config_path }} > "$TMP" &&
    mv "$TMP" {{ sshd_config_path }}
  when: kerberos_present.stdout == "present"
  become: true
  notify: Restart SSH service-unix
