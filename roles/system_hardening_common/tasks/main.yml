---
# Dynamically include specific hardening tasks based on run_modes and os_type

- name: Normalize run_modes to a list
  set_fact:
    run_modes: >-
      {%- if run_modes is iterable and run_modes is not string -%}
        {{ run_modes }}
      {%- elif run_modes is string and ',' in run_modes -%}
        {{ run_modes.replace(' ', '').split(',') }}
      {%- else -%}
        [ "{{ run_modes }}" ]
      {%- endif -%}

- name: Debug selected modes
  debug:
    msg:
      - "Selected run_modes: {{ run_modes }}"
      - "Selected os_type: {{ os_type }}"

- name: Include tasks for each selected mode dynamically
  include_tasks: "{{ item_task }}"
  loop: "{{ run_modes }}"
  loop_control:
    label: "{{ item }}"
  vars:
    item_task: >-
      {{
        (item + '_unix.yml')
        if os_type == 'unix'
        else (item + '.yml')
      }}
  when: item_task is file
