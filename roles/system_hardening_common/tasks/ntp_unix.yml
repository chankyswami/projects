# ============================================
# NTP Hardening for UNIX Variants
# AIX / Solaris / HP-UX
# Harden only if already configured
# ============================================

- name: Detect OS type
  ansible.builtin.raw: uname
  register: os_name
  changed_when: false

- name: Set NTP paths and restart command per OS
  ansible.builtin.set_fact:
    ntp_conf_path: >-
      {% if 'SunOS' in os_name.stdout %}
        /etc/inet/ntp.conf
      {% else %}
        /etc/ntp.conf
      {% endif %}
    ntp_restart_cmd: >-
      {% if 'AIX' in os_name.stdout %}
        stopsrc -s xntpd; startsrc -s xntpd
      {% elif 'SunOS' in os_name.stdout %}
        svcadm restart ntp
      {% elif 'HP-UX' in os_name.stdout %}
        /sbin/init.d/xntpd restart
      {% else %}
        echo "Unsupported UNIX OS"
      {% endif %}

# ------------------------------------------------
# Check if NTP is configured at all
# ------------------------------------------------
- name: Check if NTP config exists and has servers
  ansible.builtin.raw: |
    [ -f {{ ntp_conf_path }} ] && grep -E '^\s*server\s+' {{ ntp_conf_path }} || true
  register: ntp_config_check
  changed_when: false

# ------------------------------------------------
# Skip if NTP is not configured
# ------------------------------------------------
- name: Skip NTP hardening if not configured
  ansible.builtin.debug:
    msg: "NTP is not configured on this UNIX system. Skipping hardening."
  when: ntp_config_check.stdout == ''

# ------------------------------------------------
# Backup existing config
# ------------------------------------------------
- name: Backup existing NTP config
  ansible.builtin.raw: |
    cp {{ ntp_conf_path }} {{ ntp_conf_path }}.bak_{{ timestamp }}
  when: ntp_config_check.stdout != ''

# ------------------------------------------------
# Enforce managed NTP servers
# ------------------------------------------------
- name: Enforce managed NTP servers
  ansible.builtin.raw: |
    awk '
    BEGIN {found=0}
    /^# BEGIN ANSIBLE MANAGED NTP SERVERS/ {found=1}
    /^# END ANSIBLE MANAGED NTP SERVERS/ {found=0; next}
    {if (!found) print}
    END {
      print "# BEGIN ANSIBLE MANAGED NTP SERVERS"
    {% for server in ntp_servers %}
      print "server {{ server }} iburst"
    {% endfor %}
      print "# END ANSIBLE MANAGED NTP SERVERS"
    }' {{ ntp_conf_path }} > /tmp/ntp.conf && mv /tmp/ntp.conf {{ ntp_conf_path }}
  when: ntp_config_check.stdout != ''
  notify: Restart NTP service
